name: Docker Workflow

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Version Tag"
                required: true
    pull_request:
        branches: [main]

permissions: # Add the permissions field here
    contents: read
    packages: write

jobs:
    build-smoke:
        # Build the image on pull requests without pushing it, so changes
        # to the Dockerfile (including the base image digest pin) are
        # validated by CI before they reach main
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Build the image
              run: docker build -t bazarr_autotranslate:smoke .

            - name: Check the base image digest against the tag
              run: |
                  pinned="$(grep -oP '(?<=@)sha256:[0-9a-f]{64}' Dockerfile)"
                  current="$(docker buildx imagetools inspect python:3.12-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')"
                  echo "Pinned digest: $pinned"
                  echo "Current tag digest: $current"
                  if [ "$pinned" != "$current" ]; then
                    echo "::warning::python:3.12-alpine has moved upstream: the Dockerfile pins $pinned but the tag now resolves to $current. Re-pin the digest when upgrading."
                  fi

    build-and-push:
        # Publishing stays manual: only a dispatched release build pushes
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            PLATFORMS: linux/amd64, linux/arm64
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # The latest-tag detection compares the dispatched tag
                  # against the full tag list, which needs the tags on
                  # disk: the default shallow checkout fetches a single
                  # commit and no tags at all
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner  }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Determine Tag Name
              # Only workflow_dispatch can trigger this workflow, so the tag
              # always comes from the dispatch input
              run: echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_ENV

            - name: Determine if latest tag
              run: |
                  current_tag=${{ env.tag }}
                  # Fetch all tags, exclude alpha and beta, include the current tag in comparison
                  all_tags=$(git tag -l | grep -v -E 'alpha|beta'; echo "$current_tag")
                  latest_stable_tag=$(echo "$all_tags" | sort -V | tail -n1)
                  if [[ "$current_tag" == "$latest_stable_tag" && ! "$current_tag" =~ alpha|beta ]]; then
                    echo "is_latest=true" >> $GITHUB_ENV
                  else
                    echo "is_latest=false" >> $GITHUB_ENV
                  fi

            - name: Lowercase Repository Name
              run: echo "lowercase_repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: Build and push image with latest tag
              if: env.is_latest == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ env.lowercase_repo }}:${{ env.tag }}
                      ghcr.io/${{ env.lowercase_repo }}:latest
                  platforms: ${{ env.PLATFORMS }}

            - name: Build and push image without latest tag
              if: env.is_latest != 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ghcr.io/${{ env.lowercase_repo }}:${{ env.tag }}
                  platforms: ${{ env.PLATFORMS }}